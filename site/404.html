<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Zak Lyons — this page doesn't exist. Yet." />
    <meta name="theme-color" content="#171e2e" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/src/fastlane/pages.css" />
    <title>Page not found — Zak Lyons</title>
    <style>
      /* This page only — the 404's own centered "empty street" composition,
         built on the fast-lane tokens/fonts (pages.css) rather than a new
         stylesheet. Static HTML, zero JS, so a host can serve it with no
         app shell at all when nothing else matches. */
      .nf-main {
        min-height: calc(100vh - 160px);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        max-width: var(--measure);
        margin: 0 auto;
        padding: 48px 28px 96px;
      }
      .nf-eyebrow {
        margin: 0 0 18px;
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      .nf-heading {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 680;
        font-size: clamp(2rem, 6vw, 3.4rem);
        line-height: 1.08;
        letter-spacing: -0.005em;
        max-width: 16ch;
      }
      .nf-rule {
        width: 64px;
        height: 2px;
        margin: 26px 0;
        background: linear-gradient(90deg, var(--accent), rgba(245, 164, 92, 0));
        border: none;
      }
      .nf-voice {
        margin: 0 0 34px;
        font-family: var(--font-serif);
        font-style: italic;
        font-size: 17px;
        color: var(--ink-muted);
        max-width: 34ch;
      }
      .nf-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px 28px;
        align-items: center;
      }
      .nf-home {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-sans);
        font-size: 14px;
        font-weight: 600;
        padding: 11px 20px;
        border: 1px solid var(--rule);
        border-radius: 6px;
        text-decoration: none;
        color: var(--ink);
      }
      .nf-home:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .nf-lane {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .nf-lane a {
        color: var(--ink-muted);
        text-decoration: none;
      }
      .nf-lane a:hover {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header class="fl-header">
      <div class="fl-header-inner">
        <div class="fl-identity">
          <h1 class="fl-name">Zak Lyons</h1>
          <p class="fl-role">Senior Software Engineer</p>
        </div>
        <nav class="fl-nav" aria-label="Professional">
          <a href="/resume">Resume</a>
          <a href="/experience">Experience</a>
          <a href="/projects">Projects</a>
          <a href="/contact">Contact</a>
        </nav>
      </div>
    </header>
    <main class="nf-main">
      <p class="nf-eyebrow">404</p>
      <h2 class="nf-heading">This street doesn&rsquo;t exist. Yet.</h2>
      <hr class="nf-rule" aria-hidden="true" />
      <p class="nf-voice">
        Wrong turn. The rest of the neighborhood is still right where you left it.
      </p>
      <div class="nf-actions">
        <a class="nf-home" href="/">&larr; Take me home</a>
        <p class="nf-lane">
          <a href="/resume">Resume</a>
          <span aria-hidden="true"> · </span>
          <a href="/experience">Experience</a>
          <span aria-hidden="true"> · </span>
          <a href="/projects">Projects</a>
          <span aria-hidden="true"> · </span>
          <a href="/contact">Contact</a>
        </p>
      </div>
    </main>
  </body>
</html>
